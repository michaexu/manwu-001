<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家后台管理系统 - 积分活动</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="#DC2626"/>
            <path d="M20 10L24 17L32 18L26 24L28 32L20 28L12 32L14 24L8 18L16 17L20 10Z" fill="white"/>
          </svg>
        </div>
        <h2>商家后台管理</h2>
        <p>请使用管理员账号登录</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <div id="loginError" class="login-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          登 录
        </button>
      </form>
    </div>
  </div>

  <!-- Main App Layout -->
  <div id="app" class="app-layout" style="display:none">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="#DC2626"/>
            <path d="M20 10L24 17L32 18L26 24L28 32L20 28L12 32L14 24L8 18L16 17L20 10Z" fill="white"/>
          </svg>
          <span>积分管理后台</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          数据概览
        </a>
        <a href="#activities" class="nav-item" data-page="activities">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 4.5C2 3.67 2.67 3 3.5 3h2c.83 0 1.5.67 1.5 1.5v2C7 7.33 6.33 8 5.5 8h-2C2.67 8 2 7.33 2 6.5v-2zM2 13.5c0-.83.67-1.5 1.5-1.5h2c.83 0 1.5.67 1.5 1.5v2c0 .83-.67 1.5-1.5 1.5h-2c-.83 0-1.5-.67-1.5-1.5v-2zM11 4.5c0-.83.67-1.5 1.5-1.5h2c.83 0 1.5.67 1.5 1.5v2c0 .83-.67 1.5-1.5 1.5h-2c-.83 0-1.5-.67-1.5-1.5v-2zM11 13.5c0-.83.67-1.5 1.5-1.5h2c.83 0 1.5.67 1.5 1.5v2c0 .83-.67 1.5-1.5 1.5h-2c-.83 0-1.5-.67-1.5-1.5v-2z" fill="currentColor"/></svg>
          活动管理
        </a>
        <a href="#members" class="nav-item" data-page="members">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          会员管理
        </a>
        <a href="#redemptions" class="nav-item" data-page="redemptions">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10l2.5 2.5L13 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          核销记录
        </a>
        <a href="#points" class="nav-item" data-page="points">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          积分管理
        </a>
        <a href="#merchants" class="nav-item" data-page="merchants">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 18h16M3 18V9l7-5 7 5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 18v-6h6v6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          商家管理
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v2M10 15.5v2M3.5 6.5l1.5 1.5M15 12l1.5 1.5M2.5 10h2M15.5 10h2M3.5 13.5l1.5-1.5M15 8l1.5-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          系统设置
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="sidebarAvatar">管</div>
          <div class="user-details">
            <span class="user-name" id="sidebarName">管理员</span>
            <span class="user-role">超级管理员</span>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn" title="退出登录">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 17H4a1 1 0 01-1-1V4a1 1 0 011-1h3M13 14l4-4-4-4M17 10H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">数据概览</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-time" id="topbarTime"></div>
        </div>
      </header>
      <div class="content-area" id="contentArea">
        <!-- Page content rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modalBox">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
